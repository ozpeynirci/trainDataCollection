<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fd6">
<title>Rayda · Canlı tren takip</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#fff; --ink:#18212c; --mute:#677283; --line:#e3e7ec;
    --sea:#d7e6f2; --land:#f6f3ec; --prov:#d9d1c3; --lake:#c3d9ee; --river:#a7c6e4;
    --rail:#bdb5a8; --plabel:#a69d8f;
    --route:#9db8e8; --done:#1d5fd6; --accent:#e4572e; --stfill:#fff; --ok:#22a35a; --idle:#b8bec8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1318; --card:#181e26; --ink:#e6eaf0; --mute:#95a0ad; --line:#2a323d;
      --sea:#132331; --land:#1e242c; --prov:#323a45; --lake:#1b3247; --river:#244661;
      --rail:#4a525c; --plabel:#6c7480;
      --route:#2f4f86; --done:#5b93f5; --accent:#ff7a50; --stfill:#181e26; --idle:#3a424d; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex:none}
  .hleft{display:flex;align-items:center;gap:10px;min-width:0}
  .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;flex:none;display:grid;place-items:center}
  .back::before{content:"";width:8px;height:8px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin-left:3px}
  .hright{display:flex;align-items:center;gap:6px;flex:none}
  .info{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 14px/1 Georgia,serif;cursor:pointer;flex:none}
  h1{font-size:20px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .route-sub{color:var(--mute);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 11px;white-space:nowrap}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
  .live.on{color:var(--ink)}
  .live.on .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  [hidden]{display:none!important}

  /* ---- liste ---- */
  #home{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .search{flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;margin-bottom:10px}
  .search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}
  .search::before{content:"";width:13px;height:13px;border:2px solid var(--mute);border-radius:50%;flex:none;box-shadow:5px 5px 0 -3px var(--mute)}
  .tlist{flex:1 1 auto;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;align-content:start;padding-bottom:4px}
  .titem{padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px}
  .titem:hover{border-color:var(--done)}
  .titem.sel{border-color:var(--done);box-shadow:0 0 0 2px color-mix(in srgb,var(--done) 30%,transparent)}
  .titem .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .titem .nm{font-weight:650;font-size:16px}
  .titem .no{color:var(--mute);font-size:12.5px}
  .titem .rt{font-size:14.5px}
  .titem .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:13px}
  .titem .hit{color:var(--done);font-size:13px}
  .badge{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--line);color:var(--mute);white-space:nowrap}
  .badge.run{background:color-mix(in srgb,var(--done) 14%,transparent);color:var(--done);font-weight:600}
  .dly{font-size:12px;font-weight:600;border-radius:99px;padding:1px 7px;margin-left:6px}
  .dly.late{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .dly.early{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
  .badge.live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:600}
  .mini{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .mini>i{display:block;height:100%;background:var(--done)}
  .empty{color:var(--mute);padding:20px 4px}

  .homegrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:10px}
  .homegrid .tlist{grid-template-columns:1fr;overflow:auto;min-height:0}
  .mapslot{display:flex;min-height:0;flex:1 1 auto}
  .mapslot>.mapcard{flex:1 1 auto}
  .ldot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .pop{position:absolute;left:10px;bottom:10px;width:min(330px,calc(100% - 20px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px;z-index:6;font-size:14px}
  .pop .pt{font-weight:650;font-size:15.5px;padding-right:22px}
  .pop .ps{color:var(--mute);font-size:13px;margin:1px 0 8px}
  .pop .pr{display:flex;justify-content:space-between;gap:10px;margin:3px 0}
  .pop .pr span:first-child{color:var(--mute)}
  .pop .px{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;color:var(--mute);cursor:pointer;line-height:1}
  .pop .pgo{margin-top:10px;width:100%;border:0;background:var(--done);color:#fff;border-radius:9px;padding:8px;font-weight:600;cursor:pointer}
  .ovl{font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
  /* ---- tren ---- */
  #trainView{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .svcs{display:flex;gap:6px;margin:-2px 0 8px;flex:none;flex-wrap:wrap}
  .svcs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}
  .svcs button.on{background:var(--done);border-color:var(--done);color:#fff}
  .status{position:relative;display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1.2fr;gap:14px;padding:14px 16px;margin-bottom:10px;flex:none;z-index:5}
  .k{color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .v{font-size:17px;font-weight:600;margin-top:2px;line-height:1.3}
  .v small{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:1px}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--done);width:0;transition:width .6s}
  .mapcard{position:relative;overflow:hidden;flex:1 1 auto;min-height:170px;touch-action:none}
  svg{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
  svg.drag{cursor:grabbing}
  .mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
  .mapbtns button{min-width:38px;height:38px;padding:0 10px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer}
  .mapbtns button.on{background:var(--done);color:#fff;border-color:var(--done)}
  .mapbtns .z{font-size:20px;line-height:1}
  #expand{display:none}
  body.mapfull #homeMapSlot{height:auto!important;flex:1 1 auto}
  body.mapfull .homegrid .tlist,body.mapfull #home .search{display:none}
  .khead{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .khead .k,.allbtn{white-space:nowrap}
  .mob{display:none}
  .allbtn{font-size:12.5px;color:var(--done);background:none;border:0;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .allbtn i{width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
  .allbtn[aria-expanded=true] i{transform:rotate(-135deg);margin-top:3px}
  .allpanel{position:absolute;left:-1px;right:-1px;top:calc(100% - 8px);background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;box-shadow:0 12px 24px rgba(0,0,0,.14);overflow:hidden}
  .alllist{position:relative;max-height:min(55dvh,460px);overflow:auto;padding:4px 0;overscroll-behavior:contain}
  .stop{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:6px 16px;font-size:14px;cursor:pointer}
  .stop .t{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
  .stop .t b{color:var(--ink);font-weight:600}
  .alllist .stop{grid-template-columns:22px 1fr 46px 78px}
  .stophead{display:grid;grid-template-columns:22px 1fr 46px 78px;gap:10px;padding:6px 16px 4px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:-4px;background:var(--card);z-index:1}
  .stophead span:nth-child(n+3){text-align:right}
  .dl{font-size:11.5px;font-weight:600;color:var(--mute)}
  .dl.late{color:var(--accent)}
  .dl.early{color:var(--ok)}
  .na{color:var(--mute)}
  .stop.passed .name,.stop.passed .t{color:var(--mute);opacity:.75}
  .stop.next{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .stop.next .name{font-weight:650}
  .stop.now{background:color-mix(in srgb,var(--done) 9%,transparent)}
  .pin{width:12px;height:12px;border-radius:50%;border:2px solid var(--done);background:var(--stfill);justify-self:center}
  .passed .pin{background:var(--done)}
  .next .pin{border-color:var(--accent);background:var(--accent)}
  .now .pin{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:460px;width:100%;padding:18px 18px 14px;font-size:14px;line-height:1.6;box-shadow:0 20px 40px rgba(0,0,0,.25)}
  .modal h2{font-size:16px;margin:0 0 8px}
  .modal .muted{color:var(--mute);font-size:12.5px}
  .modal .close{float:right;margin-top:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
  .stl{font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
  .stl.minor{font-weight:400;fill:var(--mute)}
  .pl{fill:var(--plabel);font-style:italic;letter-spacing:.06em;text-transform:uppercase}

  @media (max-width:760px){
    .wrap{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
    h1{font-size:18px}
    .tlist{grid-template-columns:1fr}
    .homegrid{display:flex;flex-direction:column}
    #homeMapSlot{order:-1;flex:none;height:46vh;height:46dvh}
    .homegrid .tlist{flex:1 1 auto}
    .pop{bottom:56px}
    .status{grid-template-columns:1fr 1fr;gap:10px 12px;padding:11px 13px}
    .v{font-size:15px}
    .k{font-size:10.5px}
    .status .v small{font-size:12.5px}
    .mapcard{border-radius:12px}
    header{margin-bottom:8px}
    .mapbtns{right:8px;top:auto;bottom:8px;flex-direction:row;gap:5px}
    .mapbtns button{min-width:38px;height:38px;font-size:13px;padding:0 8px}
    body.ovmode #expand{display:block}
    .dsk{display:none}
    .mob{display:inline}
  }
  @media (max-width:380px){ .live .lt{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hleft">
      <button class="back" id="backBtn" type="button" aria-label="Tüm trenler" hidden></button>
      <div style="min-width:0">
        <h1 id="hTitle">Rayda</h1>
        <div class="route-sub" id="hSub">Canlı tren takip</div>
      </div>
    </div>
    <div class="hright"><div class="live" id="live" hidden><span class="dot"></span><span class="lt" id="liveText">Tarifeye göre</span></div><button class="info" id="infoBtn" type="button" aria-label="Hakkında">i</button></div>
  </header>

  <!-- liste -->
  <div id="home">
    <label class="card search"><input id="q" type="search" placeholder="Tren, şehir veya istasyon ara" autocomplete="off" enterkeyhint="search"></label>
    <div class="homegrid">
      <div class="tlist" id="tlist"></div>
      <div class="mapslot" id="homeMapSlot"></div>
    </div>
  </div>

  <!-- tren -->
  <div id="trainView" hidden>
    <div class="svcs" id="svcs" hidden></div>
    <div class="card status" id="statusCard">
      <div><div class="k">Durum</div><div class="v" id="sState">–</div></div>
      <div><div class="k">Yolculuk</div><div class="v" id="sProg">–</div><div class="bar"><i id="pbar"></i></div></div>
      <div><div class="k">Konum</div><div class="v" id="sWhere">–</div></div>
      <div><div class="khead"><span class="k">Sonraki durak</span><button type="button" class="allbtn" id="allBtn" aria-expanded="false"><span class="dsk">Tüm duraklar</span><span class="mob">Tümü</span><i></i></button></div><div class="v" id="sNext">–</div></div>
      <div class="allpanel" id="allPanel" hidden><div class="alllist" id="allList"></div></div>
    </div>
    <div class="mapslot" id="trainMapSlot"></div>
  </div>

  <div id="mapHolder" hidden>
    <div class="card mapcard" id="mapcard">
      <svg id="map" role="img" aria-label="Güzergah haritası"></svg>
      <div class="pop" id="pop" hidden></div>
      <div class="mapbtns">
        <button class="z" id="zin" type="button" aria-label="Yakınlaştır">+</button>
        <button class="z" id="zout" type="button" aria-label="Uzaklaştır">−</button>
        <button id="follow" type="button" title="Treni takip et">Takip</button>
        <button id="fit" type="button" title="Tüm güzergah">Hat</button>
        <button id="tr" type="button" title="Tüm Türkiye">TR</button>
        <button id="onlyRun" type="button" title="Sadece yoldaki trenlerin hatlarını göster"><span class="dsk">Yoldakiler</span><span class="mob">Yolda</span></button>
        <button id="expand" type="button">Büyüt</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="box">
    <h2>Hakkında</h2>
    Trenlerin konumu TCDD'den alınan veriyle hesaplanır. GPS değildir; ara istasyonların haritadaki yeri yaklaşıktır.
    <div class="muted" id="dbg" style="margin-top:6px"></div>
    <div class="muted" style="margin-top:8px">Harita: Natural Earth · il sınırları: tr-geojson</div>
    <button class="close" id="closeModal" type="button">Kapat</button><div style="clear:both"></div>
  </div></div>
</div>

<script>
const BM = __BASEMAP__;
const LINES = __LINES__;
const TRAINS = __TRAINS__;
const TZ_OFF = 180, $ = id => document.getElementById(id);
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const fmt = m => { m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const dur = m => { m=Math.max(0,Math.round(m)); const h=Math.floor(m/60); return h ? `${h} sa ${m%60} dk` : `${m} dk`; };
const norm = s => s.toLocaleLowerCase("tr-TR").replace(/[çğıöşüâî]/g,c=>({ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u",â:"a",î:"i"}[c])).replace(/[^a-z0-9 ]/g," ");
const short = n => n.replace(" A.Çetinkaya","").replace(" (Basmane)","").replace(" Gar","");

// ---------- tren modelleri ----------
TRAINS.forEach(T=>{
  T.DEP = toMin(T.stops[0].d);
  let prev=T.DEP;
  const L = LINES[T.line];
  T.st = T.stops.map(s=>{
    const conv = x => { if(!x) return null; let v=toMin(x); while(v<prev) v+=1440; prev=v; return v-T.DEP; };
    const arr=conv(s.a), dep=conv(s.d);
    const g=L.stations[s.tcdd];
    return {...s, arr:arr??dep, dep:dep??arr, xy:g.xy, s:g.s};
  });
  T.TOTAL = T.st[T.st.length-1].arr;
  T.days = Math.floor((T.DEP+T.TOTAL)/1440); // kaç gün sürüyor
  T.search = norm([T.name,T.no,T.from,T.to,...T.stops.map(s=>s.name)].join(" "));
});

// ---------- zaman ----------
function trNow(){ const loc=new Date(Date.now()+TZ_OFF*60000); return {ymd:loc.toISOString().slice(0,10), min:loc.getUTCHours()*60+loc.getUTCMinutes()+loc.getUTCSeconds()/60}; }
function addDays(ymd,k){ const d=new Date(ymd+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+k); return d.toISOString().slice(0,10); }
const dayLabel = ymd => { const d=new Date(ymd+"T12:00:00Z"); return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",timeZone:"UTC"}); };

// canlı veri
let LIVE={}; // "no|service" -> status
async function fetchLive(){
  try{ const r=await fetch("/api/status"); if(!r.ok) throw 0; const j=await r.json(); LIVE = (j && j.trains) || {}; }
  catch(e){ LIVE={}; }
  render();
}
function liveAge(L){ return L && L.updatedAt ? (Date.now()-Date.parse(L.updatedAt))/60000 : null; }
function newestAge(){ const a=Object.values(LIVE).map(liveAge).filter(x=>x!=null); return a.length ? Math.min(...a) : null; }
const agoTxt = m => m<1 ? "az" : m<60 ? `${Math.max(0,Math.round(m))} dk` : m<1440 ? `${Math.round(m/60)} sa` : `${Math.round(m/1440)} gün`;
function setPill(age){ const p=$("live"), t=$("liveText"); p.hidden=false;
  if(age==null){ p.className="live"; t.textContent="Tarifeye göre"; }
  else if(age<=30){ p.className="live on"; t.textContent=`TCDD verisi · ${agoTxt(age)} önce`; }
  else { p.className="live"; t.textContent=`Tarifeye göre · son veri ${agoTxt(age)} önce`; } }
function liveFor(T,service){ const L=LIVE[T.no+"|"+service]; if(!L || !L.updatedAt) return null; const age=(Date.now()-Date.parse(L.updatedAt))/60000; return age<100 ? {...L, age} : null; }

// Bir sefer (kalkış günü) için durum
function serviceState(T, service){
  const {ymd,min}=trNow();
  const k = Math.round((Date.parse(ymd)-Date.parse(service))/86400000);
  const L = liveFor(T,service);
  // son geçilen istasyondaki gecikme; tahminlerde yalnızca ileri kaydırılır (erken geldiyse tarife korunur)
  const rawDelay = L && Number.isFinite(L.delayMin) ? L.delayMin : (L && Number.isFinite(L.lastDelay) ? L.lastDelay : 0);
  const delay = Math.max(0, rawDelay);
  let t = min + k*1440 - T.DEP - delay;
  const st=T.st, N=st.length;
  let running = t>=0 && t<=T.TOTAL, arrived = t>T.TOTAL || !!(L && L.arrived);
  if(arrived){ running=false; }
  let sPos=st[0].s, atIdx=0, nextIdx=1, atStation=true, approaching=false;
  if(running){
    nextIdx=N; atIdx=N-1; sPos=st[N-1].s;
    for(let i=0;i<N;i++){ const s=st[i], n=st[i+1];
      if(t>=s.arr && t<=s.dep){ atIdx=i; nextIdx=i+1; sPos=s.s; atStation=true; break; }
      if(n && t>s.dep && t<n.arr){ const f=(t-s.dep)/(n.arr-s.dep); atIdx=i; nextIdx=i+1; sPos=s.s+(n.s-s.s)*f; atStation=false; break; } }
    if(L){ // canlı sınır
      const lp=L.lastPassedIdx, nx=L.nextIdx;
      if(lp!=null && (atIdx<lp || (atIdx===lp && atStation))){ atIdx=lp; nextIdx=lp+1; atStation=false; const q=st[Math.min(N-1,lp+1)]; sPos=st[lp].s+(q.s-st[lp].s)*0.05; }
      if(nx!=null && nx<N && ((T.dir>0 && sPos>st[nx].s) || (T.dir<0 && sPos<st[nx].s))){ sPos=st[nx].s; atIdx=nx-1; nextIdx=nx; atStation=false; approaching=true; }
    }
  } else if(arrived){ sPos=st[N-1].s; atIdx=N-1; nextIdx=N; }

  if(NOTRACK || !/^https?:$/.test(location.protocol)) return;
  const body=JSON.stringify({t,v:VID,...extra});
  try{ if(navigator.sendBeacon && navigator.sendBeacon("/api/track",new Blob([body],{type:"application/json"}))) return; }catch(e){}
  fetch("/api/track",{method:"POST",body,keepalive:true,headers:{"content-type":"application/json"}}).catch(()=>{});
}
let lastTrackedQ="", qTimer=null;
function trackSearch(){ const q=qI.value.trim(); if(q.length<2 || norm(q)===norm(lastTrackedQ)) return; lastTrackedQ=q; track("search",{q}); }

// ---------- yönlendirme ----------
let VIEW=null;
function route(){
  const m=location.hash.match(/^#tren-([a-z0-9-]+)$/);
  const T=m && TRAINS.find(t=>t.slug===m[1]);
  if(T){
    if(VIEW!==T){ VIEW=T; track("train",{s:T.slug}); setupMap(T); chosenService=pendingService; pendingService=null; lastStopsKey=""; firstFrame=true; allPanel.hidden=true; allBtn.setAttribute("aria-expanded",false); }
    setFull(false); $("trainMapSlot").appendChild($("mapcard")); setMode("train");
    $("home").hidden=true; $("trainView").hidden=false; $("backBtn").hidden=false;
    $("hTitle").textContent=T.name; $("hSub").innerHTML=`${T.from} → ${T.to}<span class="dsk"> · her gün ${T.stops[0].d}</span>`;
    document.title=`${T.name} · ${short(T.from)} → ${short(T.to)} · Rayda`;
  } else {
    const wasTrain = VIEW!==null || !ovInit;
    VIEW=null; $("home").hidden=false; $("trainView").hidden=true; $("backBtn").hidden=true;
    $("homeMapSlot").appendChild($("mapcard")); setMode("ov");
    if(wasTrain){ ovInit=true; requestAnimationFrame(()=>{ setFollow(false); fitBox(ALLBOX.x0,ALLBOX.y0,ALLBOX.x1,ALLBOX.y1,1.08); }); }
    $("hTitle").textContent="Rayda"; $("hSub").textContent="Canlı tren takip"; document.title="Rayda · Canlı tren takip";
  }
  render();
}
function render(){ if(VIEW) renderTrain(VIEW); else { setPill(newestAge()); renderList(); renderOverview(); } }
let ovInit=false, popKey=null, pendingService=null;
function setMode(m){
  const ov = m==="ov";
  ovG.style.display = ov ? "" : "none";
  [routeLine,doneLine,stG,lblG,ghostG,trainG].forEach(e=>e.style.display = ov ? "none" : "");
  btnF.style.display = ov ? "none" : "";
  $("onlyRun").style.display = ov ? "" : "none"; document.body.classList.toggle("ovmode", ov);
  if(!ov) $("pop").hidden=true;
}
function delayChip(S){ if(!S||!S.live) return ""; const d=S.rawDelay; return d>=1?`<span class="dly late">+${d} dk</span>`:d<=-1?`<span class="dly early">${-d} dk erken</span>`:""; }
function delayText(S){ if(!S.live) return "tarifeye göre"; const d=S.rawDelay; return d>=1 ? `${d} dk gecikmeli` : d<=-1 ? `${-d} dk erken` : "zamanında"; }
let ONLY_RUN = (()=>{ try{ return localStorage.getItem("vg_onlyrun")!=="0"; }catch(e){ return true; } })();
function renderOverview(){
  ovMarks.innerHTML=""; ovDoneG.innerHTML="";
  const all=[];
  TRAINS.forEach(T=>servicesFor(T).forEach(S=>all.push(S)));
  const active=new Set(all.map(S=>S.T.line)), hide = ONLY_RUN && active.size>0;
  $("onlyRun").classList.toggle("on", ONLY_RUN);
  const tracked=new Set(TRAINS.map(T=>T.line));
  for(const id in ovBase){ const on=active.has(id), b=ovBase[id];
    b.style.display = (!tracked.has(id) || (!on && hide)) ? "none" : "";
    b.setAttribute("stroke", on ? LINE_COLOR[id] : "var(--idle)");
    b.setAttribute("opacity", on ? .3 : 1); b.setAttribute("stroke-width", on ? 4 : 2.5); }
  // gidilen kısım koyu
  all.forEach(S=>{ const T=S.T;
    el("polyline",{points:sliceLine(T.line,T.st[0].s,S.sPos),fill:"none",stroke:LINE_COLOR[T.line],"stroke-width":4.5,"stroke-linejoin":"round","stroke-linecap":"round","vector-effect":"non-scaling-stroke"},ovDoneG); });
  all.forEach(S=>{
    const T=S.T, p=atLine(T.line,S.sPos), key=T.slug+"|"+S.service, big = key===popKey || T.slug===hoverSlug;
    const ang=angOf(atLine(T.line,S.sPos-T.dir*25), atLine(T.line,S.sPos+T.dir*25));
    const g=el("g",{class:"ovm",style:"cursor:pointer"},ovMarks);
    const m=el("g",{class:"mk"},g); m.dataset.x=p.x; m.dataset.y=p.y; m.dataset.a=ang; if(big) m.dataset.big=1;
    const c=el("circle",{r:7,fill:LINE_COLOR[T.line],stroke:"#fff","stroke-width":2.5},m);
    el("path",{d:ARROW,fill:"#fff"},m);
    el("title",{},c).textContent=`${T.name} · ${T.from} → ${T.to}`;
    const t=el("text",{x:p.x,y:p.y,class:"ovl"},g); if(big) t.dataset.big=1;
    t.textContent=`${short(T.name.replace(" Treni","").replace(" Ekspresi",""))} → ${short(T.to)}${S.live&&S.rawDelay>=1?" · +"+S.rawDelay+" dk":""}`;
    g.addEventListener("click",e=>{ e.stopPropagation(); popKey=key; render();
      const card=tlist.querySelector(`[data-slug="${T.slug}"]`); if(card) card.scrollIntoView({block:"nearest",behavior:"smooth"}); });
  });
  if(popKey){ const S=all.find(S=>S.T.slug+"|"+S.service===popKey); if(S) showPop(S); else { popKey=null; $("pop").hidden=true; } }
  applyVB();
}
$("onlyRun").onclick=()=>{ ONLY_RUN=!ONLY_RUN; try{ localStorage.setItem("vg_onlyrun",ONLY_RUN?"1":"0"); }catch(e){} renderOverview(); };
const isMob = () => matchMedia("(max-width:760px)").matches;
function setFull(v){ if(document.body.classList.contains("mapfull")===v) return;
  document.body.classList.toggle("mapfull",v); $("expand").textContent = v ? "Küçült" : "Büyüt";
  if(!VIEW) requestAnimationFrame(()=>{ setFollow(false); fitBox(ALLBOX.x0,ALLBOX.y0,ALLBOX.x1,ALLBOX.y1,1.08); }); }
$("expand").onclick=e=>{ e.stopPropagation(); setFull(!document.body.classList.contains("mapfull")); };
svg.addEventListener("click",()=>{ if(!VIEW && isMob() && !lastMoved) setFull(true); });
function showPop(S){
  const T=S.T, st=T.st, n=st[Math.min(S.nextIdx,st.length-1)];
  const where = S.atStation ? st[S.atIdx].name : `${short(st[S.atIdx].name)} → ${short(n.name)}`;
  const planN=n.a||n.d, eta=fmt(toMin(planN)+S.delay);
  const pop=$("pop"); pop.hidden=false;
  pop.innerHTML=`<button class="px" aria-label="Kapat">×</button>
    <div class="pt"><span class="ldot" style="background:${LINE_COLOR[T.line]}"></span>${T.name}</div>
    <div class="ps">${T.from} → ${T.to} · ${dayLabel(S.service)} ${T.stops[0].d}</div>
    <div class="pr"><span>Durum</span><span>${delayText(S)}</span></div>
    <div class="pr"><span>Konum</span><span>${where}</span></div>
    <div class="pr"><span>Sonraki durak</span><span>${short(n.name)} ${eta}</span></div>
    <div class="pr"><span>Yolculuk</span><span>%${Math.round(S.pct*100)}</span></div>
    <button class="pgo">Ayrıntılar</button>`;
  pop.querySelector(".px").onclick=e=>{ e.stopPropagation(); popKey=null; pop.hidden=true; render(); };
  pop.querySelector(".pgo").onclick=()=>{ pendingService=S.service; popKey=null; location.hash="tren-"+T.slug; };
}
$("backBtn").onclick=()=>{ location.hash=""; };
const modal=$("modal");
$("infoBtn").onclick=()=>{modal.hidden=false;};
$("closeModal").onclick=()=>{modal.hidden=true;};
modal.addEventListener("click",e=>{ if(e.target===modal) modal.hidden=true; });
window.addEventListener("hashchange",route);
track("visit",{r:document.referrer||null});
// yönetim panelinde kapatılan seferleri çıkar (yanıt gelmezse hepsi gösterilir)
(async()=>{
  try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),2500);
    const j=await (await fetch("/api/config",{signal:ctl.signal})).json(); clearTimeout(to);
    if(Array.isArray(j.enabled)){ const on=new Set(j.enabled); for(let i=TRAINS.length-1;i>=0;i--) if(!on.has(TRAINS[i].slug)) TRAINS.splice(i,1); }
  }catch(_){}
  route(); fetchLive();
})();
setInterval(render,5000);
setInterval(fetchLive,120000);
</script>
