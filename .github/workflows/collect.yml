name: TCDD canli durum

on:
  schedule:
    - cron: "7 * * * *"        # saatte bir başlar; iş kendi içinde ~50 dk boyunca 15 dk'da bir tur atar
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Bağımlılıklar
        working-directory: scraper
        run: npm ci --no-audit --no-fund
      - name: TCDD'den oku ve siteye gönder
        working-directory: scraper
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: node scrape.mjs --loop
